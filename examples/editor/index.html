<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>cadloom — プレートエディター</title>
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,sans-serif;color:#16253b;background:#edf2f8}*{box-sizing:border-box}body{margin:0}main{max-width:1320px;padding:28px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.brand{font-size:24px;font-weight:750;letter-spacing:-1px}.brand span{color:#326bbd}h1{font-size:16px;font-weight:500;margin:4px 0;color:#5d6d82}.actions{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;padding:10px 15px;border:1px solid #c3d0e0;border-radius:9px;background:white;cursor:pointer;color:#1e3659}button.primary{background:#2563b8;color:white;border-color:#2563b8}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible{outline:3px solid #93bcf4;outline-offset:2px}.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px}.card{background:white;border:1px solid #d5dfec;border-radius:14px;overflow:hidden}.fields{padding:22px}h2{font-size:17px;margin:0 0 18px}label.field{display:block;font-size:13px;color:#4c5e75;margin-bottom:14px}input[type=text]{width:100%;font:inherit;color:#152e50;padding:9px 11px;margin-top:5px;border:1px solid #bdcbdc;border-radius:7px}fieldset{border:0;padding:0;margin:0}legend{padding:0;font-size:14px;font-weight:650;margin:12px 0 16px}label.toggle{display:flex;gap:8px;align-items:center;margin:20px 0 4px;font-size:14px}input[type=checkbox]{width:17px;height:17px;accent-color:#2563b8}.hint{font-size:12px;line-height:1.7;color:#64748b;margin:8px 0}.viewport{position:relative}canvas{display:block;width:100%;height:560px;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}.viewport-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid #e2e8f0}.viewport-head h2{margin:0;font-size:14px}.tag{background:#e8f3ef;color:#21775a;border-radius:20px;font-size:12px;padding:5px 10px}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding:18px 20px;border-top:1px solid #e2e8f0}.metric small{display:block;color:#64748b;font-size:12px}.metric strong{display:block;margin-top:6px;font-size:19px;overflow-wrap:anywhere}.message{min-height:24px;font-size:13px;line-height:1.6;margin-top:16px;color:#31715b}.message.error{color:#b42332}.footnote{color:#64748b;font-size:12px;margin:18px 0}.hidden{display:none}@media(max-width:760px){main{padding:16px}header{align-items:flex-start;flex-direction:column}.layout{grid-template-columns:1fr}.viewport{grid-row:1}.fields{padding:18px}canvas{height:390px}.metrics{gap:10px;padding:15px}.metric strong{font-size:16px}fieldset{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}}
</style></head>
<body><main>
<header><div><div class="brand">cad<span>loom</span></div><h1>寸法からつくる、穴のある板</h1></div><div class="actions"><button type="button" id="load">JSONを開く</button><button type="button" id="save" class="primary" disabled>JSONを保存</button><input class="hidden" type="file" id="file" accept=".json,application/json"></div></header>
<div class="layout"><section class="card fields" aria-label="板の寸法"><h2>板の寸法</h2><p class="hint">整数・小数・分数を入力できます。寸法は共通の任意単位です。</p>
<form id="dimensions"><label class="field">幅<input id="width" type="text" value="8" spellcheck="false" autocomplete="off"></label><label class="field">奥行き<input id="depth" type="text" value="8" spellcheck="false" autocomplete="off"></label><label class="field">厚さ<input id="thickness" type="text" value="2" spellcheck="false" autocomplete="off"></label>
<label class="toggle"><input id="has-hole" type="checkbox" checked>長方形の穴をあける</label><fieldset id="hole-fields"><legend>穴の位置と寸法</legend><label class="field">左からの位置<input id="hole-x" type="text" value="2" spellcheck="false" autocomplete="off"></label><label class="field">手前からの位置<input id="hole-y" type="text" value="2" spellcheck="false" autocomplete="off"></label><label class="field">穴の幅<input id="hole-width" type="text" value="4" spellcheck="false" autocomplete="off"></label><label class="field">穴の奥行き<input id="hole-depth" type="text" value="4" spellcheck="false" autocomplete="off"></label></fieldset>
</form><p class="hint">穴は板の内側に収めてください。寸法を変更すると形状を再計算します。</p></section>
<section class="card viewport" aria-label="3Dプレビュー"><div class="viewport-head"><h2>3Dプレビュー</h2><span id="state" class="tag">準備中</span><button id="reset" type="button">視点を戻す</button></div><canvas id="view" aria-label="編集した板の3Dメッシュ"></canvas><div class="metrics"><div class="metric"><small>底面積</small><strong id="area">—</strong></div><div class="metric"><small>厚さ</small><strong id="height">—</strong></div><div class="metric"><small>体積</small><strong id="volume">—</strong></div></div></section></div>
<p id="message" class="message" role="status" aria-live="polite">エディターを準備しています</p><p class="footnote">ドラッグで回転・ホイールで拡大縮小。計算とJSONは有理数、3D表示のみ近似です。データはブラウザー内で処理されます。</p>
</main><script type="module" src="/editor.js"></script></body></html>
